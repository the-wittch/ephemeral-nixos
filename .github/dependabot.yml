version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # security fixes only: each one needs vendorHash in installer/package.nix updated by hand
  - package-ecosystem: gomod
    directory: /installer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
