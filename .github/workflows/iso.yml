name: iso

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: release to attach the ISO to
        required: true

permissions: {}

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: free disk space
        run: sudo sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost &" &
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          printf '{"username": "alice"}\n' > settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
          nix build path:.#iso -L
          mkdir out
          cp result/iso/*.iso "out/ephemeral-nix-$TAG.iso"
          cd out && sha256sum ./*.iso > "$GITHUB_WORKSPACE/SHA256SUMS"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.iso
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # the release can show up a little after the tag
          for _ in $(seq 1 30); do
            draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null) && break
            sleep 20
          done
          # releases are immutable once published, so the ISO goes on while it's still a draft
          [[ ${draft:-} == true ]] || { echo "::error::$TAG isn't a draft release, so the ISO can't be added"; exit 1; }
          gh release upload "$TAG" out/*.iso SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
