name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# per event kind, so opened and labeled don't cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0

      - name: shellcheck
        run: nix run --inputs-from path:. nixpkgs#shellcheck -- -x -P SCRIPTDIR scripts/*.sh

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from path:. nixpkgs#nixfmt -- --check

      - name: Use example machine files
        run: |
          printf '{"username": "alice", "desktop": "gnome", "profile": "minimal"}\n' > settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix

      - name: nix flake check
        run: nix flake check path:. --no-write-lock-file --no-build

  # skipped counts as passed. not on opened: a label given at creation also fires labeled
  install-test:
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'boot-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space
        run: sudo sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost &" &
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
        with:
          extra-conf: system-features = nixos-test benchmark big-parallel kvm
      - name: install and boot
        run: nix build path:.#checks.x86_64-linux.install -L --no-link
