name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      - name: shellcheck
        run: nix run --inputs-from path:. nixpkgs#shellcheck -- -x -P SCRIPTDIR scripts/*.sh .github/*.sh installer/logo.sh

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from path:. nixpkgs#nixfmt -- --check

      - name: Use example machine files
        run: |
          printf '{"username": "alice", "desktop": "gnome", "profile": "minimal"}\n' > settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix

      - name: nix flake check
        run: nix flake check path:. --no-write-lock-file --no-build

      - name: gofmt
        run: test -z "$(nix shell --inputs-from path:. nixpkgs#go -c gofmt -l installer | tee /dev/stderr)"

      # the Go tests run while it builds
      - name: installer
        run: nix build path:.#checks.x86_64-linux.installer -L --no-link
