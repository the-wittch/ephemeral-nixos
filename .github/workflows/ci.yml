name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - name: shellcheck
        run: nix run --inputs-from path:. nixpkgs#shellcheck -- -x -P SCRIPTDIR scripts/*.sh .github/*.sh

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from path:. nixpkgs#nixfmt -- --check

      - name: Use example machine files
        run: |
          printf '{"username": "alice", "desktop": "gnome", "profile": "minimal"}\n' > settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix

      - name: nix flake check
        run: nix flake check path:. --no-write-lock-file --no-build
