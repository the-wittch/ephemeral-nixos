name: follow config

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo the-wittch/ephemeral-nixos-config --json tagName -q .tagName)
          [[ $latest =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $latest"; exit 1; }
          current=$(grep -oE 'ephemeral-nixos-config/v[0-9]+\.[0-9]+\.[0-9]+' flake.nix | cut -d/ -f2)
          if [[ $latest == "$current" ]]; then
            echo "already on $latest"
            exit 0
          fi
          branch="automation/config-$latest"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch is already open"
            exit 0
          fi

          sed -i -E "s#(ephemeral-nixos-config/)v[0-9]+\.[0-9]+\.[0-9]+\"#\1$latest\"#" flake.nix README.md
          nix flake update ephemeral

          installer=$(sed -n 's/^TAG=//p' RELEASE)
          IFS=. read -r major minor patch <<<"${installer#v}"
          next="$major.$minor.$((patch + 1))"
          .github/changelog-config.sh CHANGELOG.md "$next" "$latest"

          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "use config $latest"
          # the token stays in the environment instead of .git/config
          # shellcheck disable=SC2016 # the helper expands it when git runs it
          git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; printf "password=%s\n" "$GH_TOKEN"; }; f' \
            push origin "$branch"
          gh pr create --base main --head "$branch" --title "use config $latest" \
            --body "Points new installs at config $latest. If the install test passes, this merges itself and v$next is released."
          # PRs opened with the default token don't trigger CI
          gh workflow run ci.yml --ref "$branch"
          gh workflow run install-test.yml --ref "$branch" -f release=true
