name: install test

# manual only: gh workflow run install-test.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space
        run: sudo sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost &" &
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        with:
          extra-conf: system-features = nixos-test benchmark big-parallel kvm
      - name: example machine files
        run: |
          printf '{"username": "alice"}\n' > settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
      - name: install and boot
        run: nix build path:.#checks.x86_64-linux.install -L --no-link
